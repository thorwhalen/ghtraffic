# Build the dashboard (dashboard/) and publish it to GitHub Pages:
# https://thorwhalen.github.io/ghtraffic/
#
# The published site contains NO real data: it ships the synthetic demo,
# generated here by the package itself and never committed. Real (private)
# data is fetched in the viewer's browser from their own data repo.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Dashboard (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "ghtraffic/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Generate the synthetic demo data
        working-directory: .
        run: |
          python -m pip install --quiet .
          python -m ghtraffic demo --data-dir dashboard/public/demo

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
