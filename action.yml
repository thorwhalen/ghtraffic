name: ghtraffic
description: Collect GitHub traffic (views, clones, referrers, paths, stars) across your repos and orgs, and commit the accumulated history.
branding:
  icon: bar-chart-2
  color: blue
inputs:
  token:
    description: A token with push access to the repos to collect (classic, scopes `repo` + `read:org`, for several owners).
    required: true
  data-dir:
    description: Where the history lives in the checked-out repository.
    default: "."
  config:
    description: Path to ghtraffic.toml (default <data-dir>/ghtraffic.toml).
    default: ""
  commit:
    description: Commit and push the updated history.
    default: "true"
  allow-public:
    description: Allow committing private repos' data into a PUBLIC data repository (refused by default).
    default: "false"
  fail-on-errors:
    description: Fail the job when some repo or owner errored (never for missing access).
    default: "false"
runs:
  using: composite
  steps:
    - name: Install ghtraffic
      shell: bash
      run: |
        set -euo pipefail
        # ghtraffic needs Python 3.11+ (tomllib) and csvledger (stdlib only).
        python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))' || {
          echo "::error::ghtraffic needs Python 3.11+; add actions/setup-python before this step."; exit 1; }
        python3 -m venv "$RUNNER_TEMP/ghtraffic-venv"
        "$RUNNER_TEMP/ghtraffic-venv/bin/pip" install --quiet "$GITHUB_ACTION_PATH"

    - name: Collect and commit
      shell: bash
      env:
        GHTRAFFIC_TOKEN: ${{ inputs.token }}
        DATA_DIR: ${{ inputs.data-dir }}
        CONFIG: ${{ inputs.config }}
        COMMIT: ${{ inputs.commit }}
        ALLOW_PUBLIC: ${{ inputs.allow-public }}
        FAIL_ON_ERRORS: ${{ inputs.fail-on-errors }}
      run: |
        set -euo pipefail
        args=(collect --data-dir "$DATA_DIR")
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        [ "$FAIL_ON_ERRORS" = "true" ] && args+=(--fail-on-errors)
        status=0
        "$RUNNER_TEMP/ghtraffic-venv/bin/python" -m ghtraffic "${args[@]}" || status=$?
        [ "$COMMIT" = "true" ] || exit $status

        # Never put private repos' data into a public repository.
        if [ "$ALLOW_PUBLIC" != "true" ]; then
          "$RUNNER_TEMP/ghtraffic-venv/bin/python" -m ghtraffic guard --data-dir "$DATA_DIR" --repo "$GITHUB_REPOSITORY"
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        commit() {
          git add -A "$DATA_DIR"
          git diff --cached --quiet || git commit -q -m "ghtraffic: collect $(date -u +%F)"
        }
        commit
        # On a push race, start from the remote and collect again: merges are
        # idempotent, so re-collecting loses nothing and never conflicts.
        for attempt in 1 2 3; do
          git push -q && exit $status
          git fetch -q origin "$GITHUB_REF_NAME"
          git reset -q --hard "origin/$GITHUB_REF_NAME"
          "$RUNNER_TEMP/ghtraffic-venv/bin/python" -m ghtraffic "${args[@]}" || status=$?
          commit
        done
        echo "::error::could not push after 3 attempts"; exit 1
